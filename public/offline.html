<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Aivé</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff9ee;
        color: #2f2a24;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        background: #fff;
        border: 1px solid #eae2d6;
        border-radius: 20px;
        box-shadow: 0 2px 16px rgba(47, 42, 36, 0.06);
        padding: 32px 24px;
        max-width: 340px;
      }
      h1 {
        font-size: 20px;
        margin: 16px 0 8px;
      }
      p {
        color: #7a746c;
        font-size: 15px;
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon.svg" alt="Aivé" width="56" height="56" />
      <h1>You are offline</h1>
      <p>Aivé needs a connection to load your data. It will be here when you are back.</p>
    </div>
  </body>
</html>
